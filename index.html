<style>
:root{--ink:#203642;--muted:#657681;--teal:#0f766e;--line:#dce5e7;--paper:#f5f8f8}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,input{outline-offset:4px}button{cursor:pointer}.sidebar{width:254px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;overflow-y:auto}.brand{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:650}.mark{width:32px;height:32px;display:flex;flex-direction:column;gap:4px;justify-content:center}.mark i{height:6px;display:block;border-radius:1px;background:var(--teal)}.mark i:nth-child(2){background:#90a971;width:27px}.mark i:nth-child(3){background:#b88b50;width:22px}.side-sub{font-size:13px;color:var(--muted);margin:10px 0 25px}.search{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:11px;font-size:13px;margin-bottom:26px}.nav-label,.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:var(--muted);margin-bottom:12px}.nav a{display:flex;align-items:center;gap:12px;padding:12px 10px;font-size:14px;border-radius:6px;margin:3px 0}.nav a.active{background:#e9f4f1;color:var(--teal);font-weight:650}.nav a:hover{background:#edf3f3}.num{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;font-size:11px}.divider{height:1px;background:var(--line);margin:19px 0}.side-bottom{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.8}.version{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:3px 9px;background:white;font-size:12px}.li{width:34px;height:34px;background:#0a66c2;color:white;display:inline-grid;place-items:center;border-radius:5px}.li svg{width:22px;height:22px;fill:currentColor}.side-bottom .li{margin-top:12px}main{margin-left:254px;padding:32px 52px 0;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;font-size:13px;color:var(--muted)}.top span:first-child{display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;background:var(--teal);border-radius:50%}.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;background:white;border:1px solid var(--line);border-radius:12px;padding:34px 32px}.hero h1{font-size:39px;line-height:1.16;letter-spacing:-1.3px;font-weight:650;margin:12px 0 18px}.hero p{color:var(--muted);font-size:15px;line-height:1.7;max-width:420px}.hero img{width:100%;border-radius:5px}.btn{display:inline-flex;align-items:center;gap:25px;background:var(--teal);color:white;padding:13px 18px;border:0;border-radius:5px;font-size:14px;font-weight:600;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 16px}.section-head h2{font-size:22px;letter-spacing:-.4px;margin:0}.section-head p{font-size:13px;color:var(--muted)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:white}.workflow a{padding:22px 20px;min-height:185px;border-right:1px solid var(--line)}.workflow a:last-child{border:0}.step-no{font-size:12px;font-weight:700;color:var(--teal)}.workflow h3{font-size:18px;margin:16px 0 9px}.workflow p{font-size:13px;line-height:1.6;margin:0;color:var(--muted)}.workflow .arrow{float:right}.note{background:#eaf4f1;border-left:3px solid var(--teal);padding:17px 20px;line-height:1.7;font-size:14px;margin:24px 0}.requirements{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin:17px 0 32px}.requirements div{font-size:13px;color:var(--muted);line-height:1.7}.requirements strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.credits{border-top:1px solid var(--line);padding:27px 0;display:grid;grid-template-columns:230px 1fr 125px;gap:25px;font-size:13px;line-height:1.7}.credits .eyebrow{margin:0 0 8px}.credits p{margin:0;color:var(--muted)}article{max-width:1020px;margin:auto}article h1{font-size:36px;letter-spacing:-1px;margin:14px 0}article .lead{font-size:16px;color:var(--muted);line-height:1.7;margin-bottom:30px}.lesson{background:white;border:1px solid var(--line);border-radius:9px;padding:27px;margin:22px 0}.lesson h2{font-size:21px;margin:0 0 15px}.lesson ol{padding-left:23px;line-height:1.9;font-size:15px}.lesson li{padding-left:6px;margin-bottom:8px}.lesson img{max-width:100%;max-height:460px;display:block;margin:20px auto 0;border:1px solid var(--line);border-radius:5px}.caption{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}th{background:var(--paper)}.next{display:flex;justify-content:space-between;margin:30px 0;font-size:14px;color:var(--teal)}.about-panel{background:white;border:1px solid var(--line);border-radius:10px;padding:38px;margin:26px 0}.about-panel h2{font-size:13px;letter-spacing:2px;color:var(--muted);margin:30px 0 12px}.about-panel h2:first-child{margin-top:0}.about-panel p{font-size:17px;line-height:1.8;max-width:720px}.about-panel .li{margin-top:15px}.mobile{display:none}#empty-search{font-size:13px;color:var(--muted);display:none}
@media(max-width:950px){.sidebar{width:210px;padding:22px 14px}main{margin-left:210px;padding:24px}.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.workflow{grid-template-columns:1fr 1fr}.workflow a{border-bottom:1px solid var(--line)}.requirements{grid-template-columns:1fr}.credits{grid-template-columns:1fr}.hero img{max-height:280px;object-fit:contain}}@media(max-width:640px){.sidebar{position:relative;width:100%;padding:18px}.side-sub,.side-bottom,.nav-label,.divider{display:none}.nav{display:flex;overflow-x:auto}.nav a{white-space:nowrap}.search{margin-bottom:12px}.brand{margin-bottom:12px}main{margin-left:0;padding:20px}.top{margin-bottom:20px}.workflow{grid-template-columns:1fr}.hero{padding:24px}.credits{gap:16px}}

.original-tutorial{margin:35px 0}.pdf-description{color:var(--muted);font-size:14px;line-height:1.7}.pdf-count{font-size:13px;color:var(--muted)}.pdf-page{margin:22px 0;border:1px solid var(--line);background:white;border-radius:8px;overflow:hidden}.pdf-page figcaption{padding:12px 17px;display:flex;justify-content:space-between;align-items:center;background:white;font-size:13px}.pdf-page button,.pdf-jump button,.pdf-jump select{font:inherit;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--teal);padding:7px 12px}.pdf-page .pdf-image-button{padding:0;display:block;width:100%;border:0;border-radius:0;cursor:zoom-in}.pdf-page .pdf-image-button img{display:block;width:100%;height:auto;max-height:none;max-width:none;margin:0;border:0;border-radius:0}.pdf-jump{display:flex;gap:12px;align-items:center;font-size:14px;margin:20px 0}.pdf-dialog{width:96vw;height:94vh;max-width:none;max-height:none;border:1px solid var(--line);padding:0;border-radius:8px;background:#edf2f4;color:var(--ink)}.pdf-dialog::backdrop{background:#132632bb}.pdf-dialog[open]{display:flex;flex-direction:column}.pdf-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 18px;background:white;border-bottom:1px solid var(--line)}.pdf-toolbar button,.pdf-toolbar select{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}.pdf-toolbar .pdf-close{margin-left:auto;background:var(--teal);color:white}.pdf-view-scroll{flex:1;min-height:0;overflow:auto;padding:18px}#pdf-large-image{display:block;max-width:none;height:auto;margin:0;background:white}.view-original{display:inline-block;font-size:14px;color:var(--teal);margin-left:15px}.pdf-toolbar label{font-size:13px}@media(max-width:640px){.view-original{display:block;margin:15px 0 0}.pdf-dialog{width:98vw;height:97vh}.pdf-toolbar{padding:10px;gap:6px}.pdf-toolbar button,.pdf-toolbar select{font-size:12px;padding:7px}.pdf-view-scroll{padding:5px}.section-head{flex-wrap:wrap;gap:8px}}
.li{width:115px;height:auto;background:transparent;border-radius:4px;overflow:hidden}.li img{width:100%;height:auto;display:block;mix-blend-mode:darken;margin:0;border:0;max-height:none}.about-panel .li{width:130px}.side-bottom .li{width:100px}

</style></head><body>
<aside class="sidebar"><a class="brand" href="#overview"><img class="brand-icon" src="assets/geosketch-icon.png" alt="" width="40" height="40">GeoSketch</a><div class="side-sub">User guide · Windows desktop app</div><input class="search" type="search" placeholder="Search guide…" aria-label="Search guide"><div class="nav-label">GET STARTED</div><nav class="nav"><a href="#overview">Overview</a><a href="#data"><span class="num">01</span>Import borehole data</a><a href="#surfaces"><span class="num">02</span>Build ground surfaces</a><a href="#sections"><span class="num">03</span>Create sections</a><a href="#export"><span class="num">04</span>Export drawings</a><div class="divider"></div><a href="#projects">Save &amp; reopen projects</a><a href="#troubleshooting">Troubleshooting</a><a href="#about">About GeoSketch</a></nav><p id="empty-search">No matching chapters.</p><div class="side-bottom"><span class="version">Version 1.0.3</span><div style="margin-top:12px">Developed by Larry Yeung</div><a class="li linkedin" aria-label="Larry Yeung on LinkedIn" target="_blank" rel="noopener noreferrer"></a></div></aside>
<main><div class="top"><span><i class="dot"></i>GEOSKETCH / USER GUIDE</span><span>Version 1.0.3</span></div><div id="content"></div></main>
<template id="overview"><section class="hero"><div><div class="eyebrow">FROM GI DATA TO EDITABLE DRAWINGS</div><h1>Your ground model,<br>step by step.</h1><p>Learn how to import boreholes, build layer surfaces, create geological sections and export drawings with GeoSketch.</p><a class="btn" href="#data">Start the tutorial <span>→</span></a></div><figure style="margin:0"><img src="assets/model3d.png" alt="GeoSketch 3D solid volumes, boreholes and saved section alignments from the tutorial"><figcaption class="caption">KT12 example · 3D ground model</figcaption></figure></section><div class="section-head"><h2>Follow the four-step workflow</h2><p>Data → Surfaces → Sections → Export</p></div><section class="workflow"><a href="#data"><span class="step-no">01 <span class="arrow">↗</span></span><h3>Data</h3><p>Import CSV, match AGS records and review borehole details.</p></a><a href="#surfaces"><span class="step-no">02 <span class="arrow">↗</span></span><h3>Surfaces</h3><p>Generate layer grids and review contours, colours and 3D views.</p></a><a href="#sections"><span class="step-no">03 <span class="arrow">↗</span></span><h3>Sections</h3><p>Draw an alignment, preview coverage and save a geological section.</p></a><a href="#export"><span class="step-no">04 <span class="arrow">↗</span></span><h3>Export</h3><p>Create editable DXF drawings and export Surfer grid packages.</p></a></section><div class="note"><strong>Two sets of tabs, one project.</strong> Data, Surfaces, Sections and Export control the workflow. Plan, Section and 3D control what you see.</div><div class="section-head"><h2>Before you begin</h2></div><div class="requirements"><div><strong>Prepare your CSV</strong>Unique borehole IDs, coordinates and layer-top elevations in metres. AGS adds measured geology and SPT records.</div><div><strong>Check external tools</strong>Licensed Surfer 12.7.984 builds surfaces. AutoCAD Core Console is required for DWG boundary import.</div><div><strong>Save your project</strong>Use Save as to create a .soilproj file. Saving a section and saving the project are separate steps.</div></div></template>
<template id="data"><article><div class="eyebrow">TUTORIAL 01 / DATA</div><h1>Import and review borehole data</h1><p class="lead">CSV is the primary input. AGS attachments add measured geology and available SPT values to matching boreholes.</p></article></template>
<template id="surfaces"><article><div class="eyebrow">TUTORIAL 02 / SURFACES</div><h1>Build and review ground surfaces</h1><p class="lead">Generate grids using licensed Surfer, then inspect the interpreted ground model in Plan and 3D.</p></article></template>
<template id="sections"><article><div class="eyebrow">TUTORIAL 03 / SECTIONS</div><h1>Create a geological section</h1><p class="lead">Sections require generated surfaces. You can create and save multiple alignments in one project.</p></article></template>
<template id="export"><article><div class="eyebrow">TUTORIAL 04 / EXPORT</div><h1>Export drawings and grid data</h1><p class="lead">Review the drawing preview, choose the layers you need, and export editable CAD geometry.</p></article></template>
<template id="projects"><article><div class="eyebrow">PROJECTS</div><h1>Save, reopen and update</h1><p class="lead">Keep the working project and its exported drawings together.</p></article></template>
<template id="troubleshooting"><article><div class="eyebrow">SUPPORT</div><h1>Common issues and solutions</h1><p class="lead">Review inputs and settings before repeating an operation.</p></article></template>
<template id="about"><article><div class="eyebrow">ABOUT</div><h1>GeoSketch</h1><p class="lead">Ground investigation modelling and drawing tool.</p><span class="version">Version 1.0.3</span><div class="about-panel"><h2>DEVELOPMENT</h2><p>Developed by <strong>Larry Yeung</strong></p><h2>ACKNOWLEDGEMENTS</h2><p>Special thanks to <strong>David Tsang</strong> for the original concept, valuable insights, and guidance throughout the development.</p><a class="li linkedin" aria-label="Larry Yeung on LinkedIn" target="_blank" rel="noopener noreferrer"></a></div><section class="lesson"><h2>Updating GeoSketch</h2><p>From version 1.0.3, use <strong>About → Check for updates → Download &amp; install update → Install &amp; restart</strong>. Save unsaved projects when prompted. Updates install for your own Windows account and retain the previous version for recovery.</p><p>Download and extract v1.0.3 manually once to get this installer. Keep project/output files outside app folders. Managed devices may require IT approval.</p></section><div class="note">The guide covers CSV and AGS data, Surfer surface generation, geological sections, 3D review and drawing exports.</div></article></template>

<script>
const linkedin='https://www.linkedin.com/in/tsz-yuen-yeung-13588a186/';
const icon='<img src="assets/linkedin-logo.png" alt="LinkedIn">';
function links(){document.querySelectorAll('.linkedin').forEach(a=>{a.href=linkedin;a.innerHTML=icon})}
function render(){let id=location.hash.slice(1)||'overview';let t=document.getElementById(id);if(!t||t.tagName!=='TEMPLATE')t=document.getElementById('overview');document.getElementById('content').innerHTML=t.innerHTML+(t.id==='about'?'<footer style="padding:24px 0;color:var(--muted);font-size:12px">GeoSketch · Version 1.0.3</footer>':`<footer class="credits"><div><div class="eyebrow">DEVELOPMENT</div><p>Developed by Larry Yeung</p></div><div><div class="eyebrow">ACKNOWLEDGEMENTS</div><p>Special thanks to David Tsang for the original concept, valuable insights, and guidance throughout the development.</p></div><a class="li linkedin" aria-label="Larry Yeung on LinkedIn" target="_blank" rel="noopener noreferrer"></a></footer>`);document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+t.id));links();tutorialDisplay(t.id);window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();document.querySelector('.search').addEventListener('input',e=>{let count=0;document.querySelectorAll('.nav a').forEach(a=>{let t=document.querySelector(a.hash);let show=(a.textContent+' '+t.content.textContent).toLowerCase().includes(e.target.value.toLowerCase());a.style.display=show?'':'none';if(show)count++});document.getElementById('empty-search').style.display=count?'none':'block'});
</script></body></html>
